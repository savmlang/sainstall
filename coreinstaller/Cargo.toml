[package]
name = "coreinstaller"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
windows-version = "^0.1"
windows = { version = "^0.62", features = [
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_System",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }
windows-registry = "^0.6"
zip = { version = "^9", default-features = false, features = [
  "deflate-flate2",
  "deflate",
  "zstd",
] }
