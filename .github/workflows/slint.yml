name: Build Slint + Coreinstaller

on:
  push:
    branches:
      - main

    paths:
      - slint.version
      - coreinstaller/**

jobs:
  win32:
    name: Build Slint (${{ matrix.target }})

    runs-on: ${{ matrix.runner || 'windows-11-arm' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: X64
            runner: windows-latest

          - target: aarch64-pc-windows-msvc
            arch: ARM64

          - target: i686-pc-windows-msvc
            arch: Win32
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Clone Slint
        run: |
          $ver = Get-Content slint.version
          $branch = $ver.Split("+")[0]

          git clone --depth 1 --branch "release/$branch" https://github.com/slint-ui/slint.git

      - name: CMake Setup Build
        working-directory: slint
        run: |
          cmake -B build -S . `
            -A ${{ matrix.arch }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" `
            -DSLINT_FEATURE_INTERPRETER=OFF `
            -DSLINT_FEATURE_TESTING=OFF `
            -DSLINT_FEATURE_SYSTEM_TRAY=OFF `
            -DSLINT_FEATURE_RENDERER_SOFTWARE=OFF `
            -DCMAKE_INSTALL_PREFIX="./slintbuild"

          cmake --build build --config Release
          cmake --install build --config Release

      - name: Build coreinstaller
        working-directory: coreinstaller
        run: |
          cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Upload Slint
        uses: actions/upload-artifact@v7
        with:
          compression-level: 9
          name: ${{ matrix.target }}
          archive: true
          path: |
            slint/slintbuild/

      - name: Upload Coreinstaller
        uses: actions/upload-artifact@v7
        with:
          compression-level: 9
          name: coreinstaller_${{ matrix.target }}
          archive: true
          path: |
            coreinstaller/target/${{ matrix.target }}/release/coreinstaller.lib

  publish:
    name: Publish Slint Build

    permissions:
      contents: write

    needs: [win32]

    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: libs
          skip-decompress: true
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.run_id }}.${{ github.run_attempt }}
          make_latest: true
          body: |
            Slint C++ Build
          files: |
            ./libs/*
